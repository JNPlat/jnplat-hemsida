                options:
                  maxlength: 120
              - name: points
                label: Punkter
                type: string
                list:
                  min: 1
                  max: 6
                options:
                  maxlength: 45
              - name: image
                label: Toppbild (bred, 16:9)
                type: image
                required: true
                description: Visas överst på tjänstesidan.
                options:
                  media: bilder
              - name: cardImage
                label: Bild på startsidan (hög)
                type: image
                required: true
                description: Visas på tjänstekortet på startsidan.
                options:
                  media: bilder
              - name: cardText
                label: Text på startsidan
                type: string
                description: En kort rad under tjänstens namn på startsidan.
                options:
                  maxlength: 70
              - name: seoDescription
                label: Beskrivning för Google
                type: text
                options:
                  maxlength: 170

  - name: foretag
    label: Företag och kontakt
    type: file
    path: content/foretag.json
    format: json
    fields:
      - name: name
        label: Företagsnamn
        type: string
        required: true
        options:
          maxlength: 60
      - name: orgnr
        label: Organisationsnummer
        type: string
        options:
          maxlength: 20
      - name: taxText
        label: Skatt och moms
        type: string
        description: T.ex. Godkänd för F-skatt · Momsregistrerad
        options:
          maxlength: 80
      - name: street
        label: Gatuadress
        type: string
        options:
          maxlength: 60
      - name: postal
        label: Postnummer och ort
        type: string
        options:
          maxlength: 40
      - name: contactPerson
        label: Kontaktperson
        type: string
        options:
          maxlength: 40
      - name: phone
        label: Telefon
        type: string
        required: true
        description: Skrivs som det ska visas, t.ex. 072-284 85 57. Ändras överallt på sajten.
        pattern:
          regex: "^[0-9 +()-]{6,20}$"
          message: Bara siffror, mellanslag och bindestreck.
      - name: email
        label: E-post
        type: string
        required: true
        description: Ändras överallt på sajten.
        pattern:
          regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          message: Skriv en giltig e-postadress.
      - name: area
        label: Verksamhetsområde
        type: string
        options:
          maxlength: 40
