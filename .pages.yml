                options:
                  media: bilder
              - name: cardImage
                label: Bild på startsidan (hög)
                type: image
                required: true
                description: Visas på tjänstekortet på startsidan.
                options:
                  media: bilder
              - name: cardText
                label: Text på startsidan
                type: string
                description: En kort rad under tjänstens namn på startsidan.
                options:
                  maxlength: 70
              - name: seoDescription
                label: Beskrivning för Google
                type: text
                options:
                  maxlength: 170

          - name: restaurering
            label: Restaurering
            type: object
            fields:
              - { name: eyebrow, component: eyebrow }
              - name: intro
                label: Ingress
                type: text
                description: Kort mening under rubriken. Döljs automatiskt om sidan inte ryms på skärmen.
                options:
                  maxlength: 120
              - name: points
                label: Punkter
                type: string
                list:
                  min: 1
                  max: 6
                options:
                  maxlength: 45
              - name: image
                label: Toppbild (bred, 16:9)
                type: image
                required: true
                description: Visas överst på tjänstesidan.
                options:
                  media: bilder
              - name: cardImage
                label: Bild på startsidan (hög)
                type: image
                required: true
                description: Visas på tjänstekortet på startsidan.
                options:
                  media: bilder
              - name: cardText
                label: Text på startsidan
                type: string
                description: En kort rad under tjänstens namn på startsidan.
                options:
                  maxlength: 70
              - name: seoDescription
                label: Beskrivning för Google
                type: text
                options:
                  maxlength: 170

          - name: specialprojekt
            label: Specialprojekt
            type: object
            fields:
              - { name: eyebrow, component: eyebrow }
              - name: intro
                label: Ingress
                type: text
